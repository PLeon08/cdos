$schema: https://json-schema.org/draft/2020-12/schema
$id: cdos://schemas/task/v1
title: CDOS Task
type: object
required: [schema, id, title, status, priority, project_id]
properties:
  schema: {const: cdos.task/v1}
  id: {$ref: '../common/definitions.yaml#/$defs/id'}
  title: {type: string, minLength: 1}
  description: {type: string}
  status: {enum: [created, planned, assigned, ready, running, waiting, blocked, review, completed, failed, cancelled]}
  priority: {enum: [critical, high, medium, low]}
  project_id: {$ref: '../common/definitions.yaml#/$defs/id'}
  workflow_id: {type: [string, 'null']}
  parent_task_id: {type: [string, 'null']}
  assigned_agent: {type: [string, 'null']}
  required_skills: {type: array, items: {type: string}, uniqueItems: true}
  dependencies: {type: array, items: {type: string}, uniqueItems: true}
  artifacts: {type: array, items: {type: string}, uniqueItems: true}
  metadata: {type: object}
additionalProperties: false

