$schema: https://json-schema.org/draft/2020-12/schema
$id: cdos://schemas/secret-reference/v1
title: CDOS Secret Reference
type: object
required: [schema, id, provider, path, scope]
properties:
  schema: {const: cdos.secret-reference/v1}
  id: {$ref: '../common/definitions.yaml#/$defs/id'}
  provider: {type: string}
  path: {type: string}
  version: {type: string}
  scope: {type: object, required: [kind, id], properties: {kind: {enum: [system, project, agent, task]}, id: {type: string}}}
  expires_at: {type: [string, 'null'], format: date-time}
  metadata: {type: object}
additionalProperties: false

